[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "data_downloader"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "typer>=0.12",
    "tqdm>=4.66",
    "fastapi>=0.111",
    "uvicorn>=0.29",
    "certifi>=2024.1",
    "boto3>=1.34",
]

[project.scripts]
dl = "data_downloader.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
