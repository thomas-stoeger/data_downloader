[ncbi_gene2pubmed]
description = "NCBI gene2pubmed: links between genes and PubMed articles"
downloader = "ftp"
host = "ftp.ncbi.nlm.nih.gov"
path = "/gene/DATA/gene2pubmed.gz"

[ncbi_gene_info]
description = "NCBI gene_info: gene symbols, names, chromosomal location, and identifiers"
downloader = "ftp"
host = "ftp.ncbi.nlm.nih.gov"
path = "/gene/DATA/gene_info.gz"

[ncbi_gene2go]
description = "NCBI gene2go: gene-to-GO term associations"
downloader = "ftp"
host = "ftp.ncbi.nlm.nih.gov"
path = "/gene/DATA/gene2go.gz"

[ncbi_gene_history]
description = "NCBI gene_history: discontinued and merged gene ID history"
downloader = "ftp"
host = "ftp.ncbi.nlm.nih.gov"
path = "/gene/DATA/gene_history.gz"

[ncbi_generifs]
description = "NCBI GeneRIFs: gene-to-literature functional annotation summaries"
downloader = "ftp"
host = "ftp.ncbi.nlm.nih.gov"
path = "/gene/GeneRIF/generifs_basic.gz"

[ncbi_taxdump]
description = "NCBI Taxonomy dump: full taxonomy nodes, names, and lineage"
downloader = "ftp"
host = "ftp.ncbi.nlm.nih.gov"
path = "/pub/taxonomy/taxdump.tar.gz"

[icite]
description = "iCite Database Snapshots — NIH Open Citation Collection (monthly)"
downloader = "figshare"
collection_id = "4586573"
# Remove the 'files' key to download all files (~32 GB per snapshot).
# Available per snapshot: icite_metadata.zip, open_citation_collection.zip, icite_metadata.tar.gz
files = ["icite_metadata.zip", "open_citation_collection.zip"]

[harmonizome]
description = "Harmonizome — all distribution files per dataset (except similarity matrices) plus a JSON metadata sidecar (~150 datasets)"
downloader = "harmonizome"

[openalex]
description = "OpenAlex snapshot — all entity types under data/ (excludes legacy-data/)"
downloader = "openalex"

[nih_exporter]
description = "NIH ExPORTER bulk data — projects, abstracts, publications, link tables, patents, clinical studies"
downloader = "nih_exporter"

[ncbi_pubmed]
description = "NCBI PubMed XML — annual baseline plus updatefiles, with MD5 verification (large, ~45 GB)"
downloader = "pubmed"

[ncbi_pubtator3]
description = "PubTator3 — PubMed/PMC entity and relation annotation tables plus BioCXML archives (~225 GB)"
downloader = "pubtator3"
host = "ftp.ncbi.nlm.nih.gov"
path = "/pub/lu/PubTator3"
# By default every *.gz in the directory is downloaded. Add a 'files' allowlist
# to restrict to a subset, e.g. files = ["bioconcepts2pubtator3.gz", ...].

[ncbi_nlmcatalog_reportedmedline]
description = "NLM Catalog journals that report MEDLINE indexing status (term=reportedmedline, full XML via E-utilities)"
downloader = "nlmcatalog"
term = "reportedmedline"

[retractionwatch_retractiondatabase]
description = "Retraction Watch retraction database — Crossref's daily CSV of retractions (single retraction_watch.csv plus README)"
downloader = "retractionwatch"

[retractionwatch_hijackedjournals]
description = "Retraction Watch Hijacked Journal Checker — public Google Sheet of hijacked (clone) journals, exported as CSV"
downloader = "google_sheet"
sheet_id = "1ak985WGOgGbJRJbZFanoktAN_UFeExpE"
gid = "5255084"
filename = "hijacked_journals.csv"

[predatory_publishers]
description = "Predatory publishers — public Google Sheet list, exported as CSV (no upstream version; versioned by capture date plus content hash)"
downloader = "google_sheet_hashed"
sheet_id = "1BHM4aJljhbOAzSpkX1kXDUEvy6vxREZu5WJaDH6M1Vk"
gid = "0"
filename = "predatory_publishers.csv"

[predatory_journals]
description = "Predatory journals — public Google Sheet list, exported as CSV (no upstream version; versioned by capture date plus content hash)"
downloader = "google_sheet_hashed"
sheet_id = "1Qa1lAlSbl7iiKddYINNsDB4wxI7uUA4IVseeLnCc5U4"
gid = "0"
filename = "predatory_journals.csv"
[geneontology_basic]
description = "Gene Ontology (go-basic) — the filtered, cycle-free OBO release suitable for most uses; versioned by the file's own data-version date"
downloader = "obo"
url = "https://purl.obolibrary.org/obo/go/go-basic.obo"
filename = "go-basic.obo"

[opentargets]
description = "Open Targets Platform — release Parquet datasets, plus the field-level schema (croissant.json) and the per-dataset text descriptions shown on the Downloads page (downloads.json)"
downloader = "opentargets"
# Which output datasets to download the Parquet bytes for. The schema and the
# descriptions for the whole release are captured regardless of this list.
# Set datasets = ["*"] to fetch every dataset in the release (large: release
# 26.03 has 55 datasets, well over 100 GB). Dataset names change between
# releases; if a name is not present, the downloader fails and prints the full
# list of names available in that release (also visible by browsing
# https://ftp.ebi.ac.uk/pub/databases/opentargets/platform/<version>/output/).
datasets = ["target", "disease", "drug_molecule", "association_overall_direct", "mouse_phenotype", "target_essentiality"]
# Optional: pin a specific release instead of tracking the latest YY.MM.
# version = "25.06"
