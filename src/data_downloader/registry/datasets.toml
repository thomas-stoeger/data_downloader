files = ["gwas-catalog-associations_ontology-annotated-full.zip", "gwas-catalog-studies.tsv", "gwas-catalog-ancestry.tsv", "gwas-efo-trait-mappings.tsv"]

# Declared-only: the GWAS Catalog is distributed under EMBL-EBI's standard terms
# of use (the catalog data is treated as freely reusable facts; the full
# summary-statistics datasets, not fetched here, are CC0). No single clean
# legalcode file is published for the catalog download, and the EBI terms page
# host is not contacted, so no license copy is captured.
[gwas_catalog.license]
declared_at = ["https://www.ebi.ac.uk/gwas/docs/about", "https://www.ebi.ac.uk/about/terms-of-use"]
note = "NHGRI-EBI GWAS Catalog, a collaboration of EMBL-EBI and NHGRI. Distributed under EMBL-EBI's terms of use; the catalog content is freely reusable (cite the Catalog and the underlying studies). No fetchable license file; no copy captured."

[biogrid_interactions]
description = "BioGRID interaction data — the curated protein, genetic, and chemical interaction database (the comprehensive BIOGRID-ALL TAB3 table from the Latest-Release); versioned by BioGRID release number. This is the BioGRID interaction database (thebiogrid.org), NOT BioGRID ORCS, the separate CRISPR-screen / functional-genomics repository (orcs.thebiogrid.org), which is not downloaded here."
downloader = "biogrid"
# Which stable Latest-Release files to download. Defaults to the comprehensive
# all-interactions TAB3 archive. "LATEST" is replaced with the release number in
# the saved file name. Other options include BIOGRID-ORGANISM-LATEST.tab3.zip
# (per-organism split) and the MV-Physical / chemical archives.
files = ["BIOGRID-ALL-LATEST.tab3.zip"]

# Declared-only: BioGRID data is distributed under the MIT License, but no
# standalone legalcode file is published on an allowed host to capture. The
# BioGRID downloads/wiki pages are recorded as provenance, never fetched.
[biogrid_interactions.license]
declared_at = ["https://downloads.thebiogrid.org/BioGRID", "https://wiki.thebiogrid.org/doku.php/downloads"]
spdx = "MIT"
note = "BioGRID data is released under the MIT License. No standalone license document is captured (no clean legalcode on an allowed host); cite BioGRID and the underlying source publications."

[disease_ontology]
description = "Human Disease Ontology (DOID) — OBO release of standardized human disease terms and their hierarchy; versioned by the ontology's own data-version date"
downloader = "obo"
url = "https://purl.obolibrary.org/obo/doid.obo"
filename = "doid.obo"

[disease_ontology.license]
declared_at = "https://obofoundry.org/ontology/doid.html"
url = "https://creativecommons.org/publicdomain/zero/1.0/legalcode.txt"
spdx = "CC0-1.0"
note = "The Disease Ontology is released CC0 1.0 (stated in the OBO header's dcterms:license and remark)."

[hgnc]
description = "HGNC (HUGO Gene Nomenclature Committee) complete set — approved human gene symbols, names, locus type/group, location, symbol/name assignment dates, and cross-references; the newest immutable monthly archive snapshot (TSV); versioned by the snapshot date"
downloader = "hgnc"

# Declared-only: HGNC states it imposes no restrictions on access to or use of
# its data, but publishes no standalone license file to capture. The genenames
# policy page is recorded as provenance, never fetched (adds no allowed domain).
[hgnc.license]
declared_at = "https://www.genenames.org/about/"
note = "HGNC imposes no restrictions on access to or use of the data (genenames.org). No standalone license document is published, so no copy is captured."

[intact]
description = "IntAct (EMBL-EBI) molecular interactions — the full curated binary-interaction table in PSI-MITAB format (interactors, detection method, publication, confidence) plus its column README; versioned by the release's Last-Modified date"
downloader = "intact"
# Which files to download from current/psimitab/. Defaults to the full MITAB
# table and its README. Other files include intact-micluster.zip (MI-cluster
# scored) and the negative-interaction sets.
files = ["intact.zip", "README"]

[intact.license]
declared_at = "https://www.ebi.ac.uk/intact/about"
url = "https://creativecommons.org/licenses/by/4.0/legalcode.txt"
spdx = "CC-BY-4.0"
note = "IntAct data is licensed CC BY 4.0. Cite IntAct and the underlying source publications; curated records draw on member IMEx databases that may carry their own attribution terms."

[interpro]
description = "InterPro — per-protein matches to integrated InterPro entries (protein2ipr.dat.gz, accession + name), the entry hierarchy (ParentChildTreeFile.txt) for ancestor expansion, plus entry metadata, schema, and lookups; versioned by InterPro release number"
downloader = "interpro"
# Which files to download from the release directory. Defaults to the set that
# supports protein -> InterPro name + parent expansion, plus metadata/schema:
#   protein2ipr.dat.gz (large, ~17 GB), ParentChildTreeFile.txt, entry.list,
#   interpro.xml.gz, interpro.dtd, names.dat, short_names.dat, interpro2go,
#   release_notes.txt. Other files include match_complete.xml.gz (signature
#   level, much larger), sites.xml.gz, and the *.tar.gz match archives.
files = ["protein2ipr.dat.gz", "ParentChildTreeFile.txt", "entry.list", "interpro.xml.gz", "interpro.dtd", "names.dat", "short_names.dat", "interpro2go", "release_notes.txt"]

[interpro.license]
declared_at = "https://www.ebi.ac.uk/interpro/about/license/"
url = "https://creativecommons.org/publicdomain/zero/1.0/legalcode.txt"
spdx = "CC0-1.0"
note = "InterPro's own downloadable data (also Pfam, PRINTS, SFLD) is CC0 1.0. The integrated member databases (CATH-Gene3D, CDD, HAMAP, PANTHER, PIRSF, PROSITE, SMART, SUPERFAMILY, NCBIFAM, etc.) keep their own terms; cite the resource and the relevant member databases."

[uniprot_fasta]
description = "UniProt protein sequences (FASTA) — reviewed Swiss-Prot sequences from the knowledgebase complete/ directory; versioned by UniProt release tag"
downloader = "uniprot"
path = "complete"
# Which FASTA files to download. Options in complete/: uniprot_sprot.fasta.gz
# (reviewed Swiss-Prot), uniprot_sprot_varsplic.fasta.gz (isoforms),
# uniprot_trembl.fasta.gz (unreviewed TrEMBL, ~53 GB).
files = ["uniprot_sprot.fasta.gz"]

[uniprot_fasta.license]
declared_at = ["https://www.uniprot.org/help/license", "https://ftp.uniprot.org/pub/databases/uniprot/current_release/knowledgebase/complete/LICENSE"]
url = "https://ftp.uniprot.org/pub/databases/uniprot/current_release/knowledgebase/complete/LICENSE"
spdx = "CC-BY-4.0"
note = "UniProt applies CC BY 4.0 to all copyrightable parts of its databases (per the FTP LICENSE file); reproduce the copyright statement with each copy."

[uniprot_idmapping]
description = "UniProt ID mapping — the full UniProtKB-AC / database / external-ID cross-reference table (idmapping.dat.gz) from the knowledgebase idmapping/ directory; versioned by UniProt release tag"
downloader = "uniprot"
path = "idmapping"
# Options in idmapping/: idmapping.dat.gz (full 3-column mapping),
# idmapping_selected.tab.gz (selected/denormalized wide table).
files = ["idmapping.dat.gz"]

[uniprot_idmapping.license]
declared_at = ["https://www.uniprot.org/help/license", "https://ftp.uniprot.org/pub/databases/uniprot/current_release/knowledgebase/complete/LICENSE"]
url = "https://ftp.uniprot.org/pub/databases/uniprot/current_release/knowledgebase/complete/LICENSE"
spdx = "CC-BY-4.0"
note = "UniProt applies CC BY 4.0 to all copyrightable parts of its databases (per the FTP LICENSE file); reproduce the copyright statement with each copy."

[opentargets]
description = "Open Targets Platform — release Parquet datasets, plus the field-level schema (croissant.json) and the per-dataset text descriptions shown on the Downloads page (downloads.json)"
downloader = "opentargets"
# Which output datasets to download the Parquet bytes for. The schema and the
# descriptions for the whole release are captured regardless of this list.
# Set datasets = ["*"] to fetch every dataset in the release (large: release
# 26.03 has 55 datasets, well over 100 GB). Dataset names change between
# releases; if a name is not present, the downloader fails and prints the full
# list of names available in that release (also visible by browsing
# https://ftp.ebi.ac.uk/pub/databases/opentargets/platform/<version>/output/).
# datasets = ["target", "disease", "drug_molecule", "association_overall_direct", "mouse_phenotype", "target_essentiality"]
datasets = ["*"]
# Optional: pin a specific release instead of tracking the latest YY.MM.
# version = "25.06"

# CC0 1.0 covers the Open Targets COMPILATION only (the aggregation, scoring,
# and schema OT authors) -- confirmed by the release croissant.json top-level
# `license` field. It does NOT relicense the constituent sources, which keep
# their own licenses on redistribution. croissant.json records no per-source
# license (single top-level CC0); the authoritative per-source table is only on
# the declared_at licence page. Obligation tiers that matter for redistribution,
# especially commercial:
#   - attribution: most sources are CC-BY (UniProt, Ensembl, GO, Reactome, MGI,
#     MONDO, ...);
#   - share-alike (viral): ChEMBL and Human Protein Atlas are CC-BY-SA 3.0;
#   - EMBL-EBI terms: ClinVar/EVA, Gene2Phenotype, IntAct, Signor, GWAS Catalog;
#   - "commercial use for Open Targets" (licensed TO Open Targets, not a blanket
#     grant to third-party redistributors): Cancer Gene Census/COSMIC, Genomics
#     England PanelApp, Project Score -- clear independently before commercial reuse.
# Of the datasets selected above: drug_molecule includes ChEMBL (CC-BY-SA),
# target_essentiality includes Project Score (commercial-use-for-OT), and
# association_overall_direct aggregates many of the above.
[opentargets.license]
declared_at = "https://platform-docs.opentargets.org/licence"
url = "https://creativecommons.org/publicdomain/zero/1.0/legalcode.txt"
spdx = "CC0-1.0"
note = "CC0 1.0 applies to the Open Targets compilation ONLY (confirmed by croissant.json top-level license). Constituent sources keep their own licenses: attribution (CC-BY), share-alike (ChEMBL + Human Protein Atlas, CC-BY-SA 3.0), EMBL-EBI terms (ClinVar/EVA, Gene2Phenotype, IntAct, Signor, GWAS Catalog), and 'commercial use for Open Targets' (COSMIC/Cancer Gene Census, Genomics England PanelApp, Project Score) which is NOT a blanket grant to downstream redistributors. Clear share-alike and commercial-use sources before redistributing, especially commercially. Full per-source table is at the declared_at licence page."
