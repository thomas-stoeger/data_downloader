description = "NCBI gene2pubmed: links between genes and PubMed articles"
downloader = "ftp"
host = "ftp.ncbi.nlm.nih.gov"
path = "/gene/DATA/gene2pubmed.gz"

[ncbi_gene2pubmed.license]
declared_at = "https://www.ncbi.nlm.nih.gov/home/about/policies/"
url = "https://www.ncbi.nlm.nih.gov/home/about/policies/"
note = "US Government public domain; NCBI places no restrictions on the use or distribution of the data."

