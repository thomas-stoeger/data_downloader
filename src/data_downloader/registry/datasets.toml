[ncbi_gene2pubmed]
description = "NCBI gene2pubmed: links between genes and PubMed articles"
downloader = "ftp"
host = "ftp.ncbi.nlm.nih.gov"
path = "/gene/DATA/gene2pubmed.gz"

[ncbi_gene_info]
description = "NCBI gene_info: gene symbols, names, chromosomal location, and identifiers"
downloader = "ftp"
host = "ftp.ncbi.nlm.nih.gov"
path = "/gene/DATA/gene_info.gz"

[ncbi_gene2go]
description = "NCBI gene2go: gene-to-GO term associations"
downloader = "ftp"
host = "ftp.ncbi.nlm.nih.gov"
path = "/gene/DATA/gene2go.gz"

[ncbi_gene_history]
description = "NCBI gene_history: discontinued and merged gene ID history"
downloader = "ftp"
host = "ftp.ncbi.nlm.nih.gov"
path = "/gene/DATA/gene_history.gz"

[ncbi_generifs]
description = "NCBI GeneRIFs: gene-to-literature functional annotation summaries"
downloader = "ftp"
host = "ftp.ncbi.nlm.nih.gov"
path = "/gene/GeneRIF/generifs_basic.gz"

[ncbi_taxdump]
description = "NCBI Taxonomy dump: full taxonomy nodes, names, and lineage"
downloader = "ftp"
host = "ftp.ncbi.nlm.nih.gov"
path = "/pub/taxonomy/taxdump.tar.gz"

[icite]
description = "iCite Database Snapshots — NIH Open Citation Collection (monthly)"
downloader = "figshare"
collection_id = "4586573"
# Remove the 'files' key to download all files (~32 GB per snapshot).
# Available per snapshot: icite_metadata.zip, open_citation_collection.zip, icite_metadata.tar.gz
files = ["icite_metadata.zip"]

[harmonizome]
description = "Harmonizome gene-to-attribute matrices for all available datasets (~150 datasets)"
downloader = "harmonizome"

[openalex]
description = "OpenAlex snapshot — all entity types under data/ (excludes legacy-data/)"
downloader = "openalex"

[nih_exporter_projects]
description = "NIH ExPORTER project data — RePORTER_PRJ_C_FY{year}.zip for FY1985–present"
downloader = "nih_exporter"
section = "projects"

[nih_exporter_abstracts]
description = "NIH ExPORTER abstracts — RePORTER_PRJABS_C_FY{year}.zip for FY1985–present"
downloader = "nih_exporter"
section = "abstracts"

[nih_exporter_publications]
description = "NIH ExPORTER publications — RePORTER_PUB_C_FY{year}.zip for FY1985–present"
downloader = "nih_exporter"
section = "publications"

[nih_exporter_linktables]
description = "NIH ExPORTER link tables (project–publication) — RePORTER_PUBLNK_C_FY{year}.zip for FY1985–present"
downloader = "nih_exporter"
section = "linktables"

[nih_exporter_patents]
description = "NIH ExPORTER patents — Patents.csv (single file, updated monthly)"
downloader = "nih_exporter"
section = "patents"

[nih_exporter_clinicalstudies]
description = "NIH ExPORTER clinical studies — ClinicalStudies.csv (single file, updated monthly)"
downloader = "nih_exporter"
section = "clinicalstudies"
