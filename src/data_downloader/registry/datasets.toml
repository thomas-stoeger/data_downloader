[ensembl_tsv]
description = "Ensembl TSV cross-references — per-species gzipped tables mapping Ensembl gene/transcript/protein IDs to Entrez, RefSeq, UniProt, ENA, plus karyotype; versioned by Ensembl release number"
downloader = "ensembl_tsv"
# Which species directories to download. Set species = ["*"] to fetch every
# species in the release (large: 350+ species). Unknown names fail with the
# list of what is available (browse https://ftp.ensembl.org/pub/current_tsv/).
species = ["homo_sapiens", "mus_musculus", "rattus_norvegicus", "danio_rerio", "drosophila_melanogaster", "caenorhabditis_elegans", "saccharomyces_cerevisiae", "gallus_gallus"]

# Declared-only: Ensembl-generated data is available without restriction, but
# the legal page 302-redirects to a regional mirror (useast/uswest/...), a poor
# stable fetch target, so no copy is downloaded.
[ensembl_tsv.license]
declared_at = "https://www.ensembl.org/info/about/legal/disclaimer.html"
note = "Ensembl-generated data is available without restriction; some included third-party data may carry constraints. No license file is fetched (the legal page redirects to a regional mirror)."

[alliancegenome]
description = "Alliance of Genome Resources — all per-species TSV bulk files for a release (orthology, disease, expression, molecular/genetic interactions, gene descriptions, variant-allele, cross-references); versioned by release number"
downloader = "alliancegenome"
# Which TSV data types to download. Use ["*"] for every TSV data type in the
# release. Restrict with a list, e.g. ["ORTHOLOGY-ALLIANCE", "DISEASE-ALLIANCE"].
# Unknown names fail with the list of what is available.
data_types = ["*"]
# Which species / member-database subtypes to download (e.g. FB, MGI, RGD, SGD,
# WB, ZFIN, HUMAN, XBXL, XBXT, COMBINED; some data types subtype by NCBI taxon
# id). Use ["*"] for every species.
species = ["*"]

# Alliance distributes its data under CC BY 4.0 (stated on the
# privacy-warranty-licensing page). Constituent member databases (FlyBase, MGI,
# RGD, SGD, WormBase, ZFIN, Xenbase) may carry their own terms on redistribution.
[alliancegenome.license]
declared_at = "https://www.alliancegenome.org/privacy-warranty-licensing"
url = "https://creativecommons.org/licenses/by/4.0/legalcode.txt"
spdx = "CC-BY-4.0"
note = "Alliance of Genome Resources data is licensed CC BY 4.0. The aggregating Alliance asserts CC BY 4.0; constituent member databases (FlyBase, MGI, RGD, SGD, WormBase, ZFIN, Xenbase) may keep their own licenses on redistribution."

[icite]
description = "iCite Database Snapshots — NIH Open Citation Collection (monthly)"
downloader = "figshare"
collection_id = "4586573"
# Remove the 'files' key to download all files (~32 GB per snapshot).
# Available per snapshot: icite_metadata.zip, open_citation_collection.zip, icite_metadata.tar.gz
files = ["icite_metadata.zip", "open_citation_collection.zip"]

# Figshare tags every iCite snapshot article CC BY 4.0 (visible on each
# snapshot's article page and in the figshare API `license` field). The
# collection page does not display a license. Note: the NIH-OCC paper describes
# the underlying collection as CC0, but the actual figshare distribution we
# download asserts CC BY 4.0, so that is what is recorded.
[icite.license]
declared_at = "https://nih.figshare.com/articles/dataset/iCite_Database_Snapshot_2026-04/32209434"
url = "https://creativecommons.org/licenses/by/4.0/legalcode.txt"
spdx = "CC-BY-4.0"
note = "Each iCite snapshot is tagged CC BY 4.0 on figshare (per-article license field). The NIH-OCC paper describes the source collection as CC0, but the figshare distribution asserts CC BY 4.0."

