# Each dataset may declare a license under a nested [<name>.license] table:
#   declared_at - where the license is stated upstream (recorded, never fetched;
#                 adds no allowed-domain). May be a string or a list.
#   url         - license document(s) downloaded into each version's _license/
#                 dir and hashed (the byte-exact copy). Omit when no clean
#                 fetchable license exists (declared-only); the note then
#                 explains why. Every url host must be in CLAUDE.md.
#   spdx, note  - optional documentation, recorded verbatim.
# See docs/DESIGN.md "Licenses" for the full contract.

