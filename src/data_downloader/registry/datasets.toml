# itself is CC BY 4.0). Crossref describes the database as a public resource and
# treats its metadata as uncopyrightable facts (its general CC0 stance), and
# requests a citation, but asserts no license on the data. Verify before relying
# on a specific license for redistribution.
[retractionwatch_retractiondatabase.license]
declared_at = ["https://www.crossref.org/documentation/retrieve-metadata/retraction-watch/", "https://gitlab.com/crossref/retraction-watch-data"]
note = "No explicit license attached to the data (no LICENSE in the GitLab repo; none named on the Crossref docs page). Crossref describes it as a public resource and treats its metadata as public-domain facts (CC0 stance); a citation to the source is requested."

